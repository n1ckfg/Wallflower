<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wallflower</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="instructions">
        WASD - Move | Q/E - Down/Up | Alt+Drag - Orbit | Shift+Alt+Drag - Pan | Scroll - Zoom<br>
        Drop .glb/.gltf - Add model | 1/2/3 - Move/Rotate/Scale model | Space - Photo | R - Record | C - Light &amp; Levels
    </div>

    <div id="recorder-hud">
        <div id="countdown"></div>
        <div id="rec-indicator"><span id="rec-dot"></span>REC <span id="rec-time">0:00</span></div>
    </div>

    <div id="flash"></div>

    <script type="importmap">
        {
            "imports": {
                "three": "./js/libraries/three/build/three.module.js",
                "three/addons/": "./js/libraries/three/examples/jsm/",
                "lil-gui": "./js/libraries/lil-gui/dist/lil-gui.esm.min.js"
            }
        }
    </script>
    <script type="module" src="js/main.js"></script>
</body>
</html>
